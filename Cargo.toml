[package]
name = "xwayclip"
version = "0.2.0"
edition = "2024"
description = "Bidirectional clipboard synchronization between X11 and Wayland"
repository = "https://github.com/so1ve/xwayclip"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.6"
clap = { version = "4.6.6", features = ["derive"] }
rustix = { version = "1.1.4", features = ["event"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wl-clipboard-rs = "0.9.3"
wl-clipboard-watch = "0.1.0"
x11rb = { version = "0.14.0", features = ["xfixes"] }

[lints.clippy]
all = "warn"
clone_on_ref_ptr = "warn"
default_trait_access = "warn"
disallowed_methods = "warn"
enum_glob_use = "warn"
fn_params_excessive_bools = "warn"
format_collect = "warn"
format_push_string = "warn"
implicit_clone = "warn"
items_after_statements = "warn"
manual_let_else = "warn"
manual_string_new = "warn"
match_same_arms = "warn"
match_wildcard_for_single_variants = "warn"
missing_const_for_fn = "warn"
must_use_candidate = "warn"
needless_pass_by_value = "warn"
redundant_pub_crate = "warn"
semicolon_if_nothing_returned = "warn"
single_match_else = "warn"
struct_excessive_bools = "warn"
undocumented_unsafe_blocks = "warn"
uninlined_format_args = "warn"
unnecessary_literal_bound = "warn"
use_self = "warn"
verbose_file_reads = "warn"
wildcard_imports = "warn"
